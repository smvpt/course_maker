# Маршрутизация форматов (pipeline.route). Меняется без правки кода.

# Шаблоны сцен роликов и интерактивов (реализует П4). types — типы трудности, для которых шаблон по умолчанию.
templates:
  T1: {about: "давление и фильтрация: поле давления и течение в пласте во времени", types: ["Ф", "М"]}
  T2: {about: "косвенное измерение: прибор — кривая — интерпретация (каротаж)", types: ["И", "Пр", "Н"]}
  T3: {about: "рост тела и слоёв во времени, строение в пространстве", types: ["Р", "В", "П"]}
  T4: {about: "ствол скважины: бурение, долото, колонна, промывка", types: []}

# Форматы, которым нужен шаблон сцены.
template_formats: ["шортс", "длинное видео", "интерактив"]
# Форматы-ролики (для доли шортсов-крючков).
video_formats: ["шортс", "длинное видео"]
# Шортсы-крючки без своего узла — не больше этой доли роликов (ТЗ: 10–20 %).
hook_short_max_share: 0.2
