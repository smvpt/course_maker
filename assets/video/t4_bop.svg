<?xml version="1.0" encoding="UTF-8"?>
<!-- Схема превентора (противовыбросового оборудования) для шаблона T4.
     Условная схема: фото-референсов в материалах проекта нет. Корпус с проходным отверстием,
     верхний и нижний фланцы, два корпуса плашек по бокам. Плашки (открыто/закрыто) рисует код. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <rect x="35" y="0" width="50" height="8" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="40" y="8" width="40" height="64" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="35" y="72" width="50" height="8" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="5" y="28" width="35" height="24" fill="none" stroke="#000000" stroke-width="2"/>
  <rect x="80" y="28" width="35" height="24" fill="none" stroke="#000000" stroke-width="2"/>
  <line x1="5" y1="40" x2="0" y2="40" stroke="#000000" stroke-width="2"/>
  <line x1="115" y1="40" x2="120" y2="40" stroke="#000000" stroke-width="2"/>
</svg>
