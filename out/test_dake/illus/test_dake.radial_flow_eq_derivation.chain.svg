<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1175" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как записать закон сохранения массы для притока к скважине</title><desc id="d">Наблюдение: Основное уравнение радиального течения жидкости в гомогенной пористой среде выводится в виде дифференциального уравнения.; Наблюдение: Аналитические решения уравнения используются для описания гидродинамических исследований скважин и притока к скважине в промысловой инженерии.; Наблюдение: В численном моделировании пластов чаще используется декартова геометрия, но приток и отток из скважины контролируются уравнениями в радиальной форме.; Допущение: При выводе уравнения принимаются следующие упрощающие допущения: пласт гомогенен по свойствам породы и изотропен по проницаемости.; Вывод: Дифференциальное уравнение выводится в радиальной форме для имитации течения флюидов вблизи скважины.; Вывод: Принцип сохранения массы для объема элемента толщиной dr формулируется как разность массовых расходов на входе и выходе, равная скорости изменения массы в элементе.</desc><rect width="400" height="1175" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как записать закон сохранения</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">массы для притока к скважине</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Основное уравнение радиального</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">течения жидкости в гомогенной</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">пористой среде выводится в виде</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">дифференциального уравнения.</text><rect x="16.0" y="233.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">Аналитические решения уравнения</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">используются для описания</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">гидродинамических исследований</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважин и притока к скважине в</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">промысловой инженерии.</text><rect x="16.0" y="388.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">В численном моделировании</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">пластов чаще используется</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">декартова геометрия, но приток</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">и отток из скважины</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">контролируются уравнениями в</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">радиальной форме.</text><line x1="200.0" y1="560.0" x2="200.0" y2="572.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,570.0 L200.0,580.0 L207.0,570.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="600.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="611.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">При выводе уравнения</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">принимаются следующие</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">упрощающие допущения: пласт</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">гомогенен по свойствам породы и</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">изотропен по проницаемости.</text><line x1="200.0" y1="758.0" x2="200.0" y2="770.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,768.0 L200.0,778.0 L207.0,768.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="798.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="809.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">Дифференциальное уравнение</text><text x="28.0" y="858.0" font-size="18" fill="#ECEFF4" text-anchor="start">выводится в радиальной форме</text><text x="28.0" y="883.0" font-size="18" fill="#ECEFF4" text-anchor="start">для имитации течения флюидов</text><text x="28.0" y="908.0" font-size="18" fill="#ECEFF4" text-anchor="start">вблизи скважины.</text><rect x="16.0" y="939.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">Принцип сохранения массы для</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">объема элемента толщиной dr</text><text x="28.0" y="1013.0" font-size="18" fill="#ECEFF4" text-anchor="start">формулируется как разность</text><text x="28.0" y="1038.0" font-size="18" fill="#ECEFF4" text-anchor="start">массовых расходов на входе и</text><text x="28.0" y="1063.0" font-size="18" fill="#ECEFF4" text-anchor="start">выходе, равная скорости</text><text x="28.0" y="1088.0" font-size="18" fill="#ECEFF4" text-anchor="start">изменения массы в элементе.</text><rect x="302.0" y="1127.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1149.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>