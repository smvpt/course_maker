<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 902" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как по набору кривых каротажа построить геологический разрез</title><desc id="d">Наблюдение: Построение разреза включает определение границ и толщин пластов и оценку литологической характеристики однородных интервалов.; Наблюдение: Литологическую характеристику пород оценивают по сумме признаков на диаграммах различных методов.; Наблюдение: Увеличение песчанистости глины уменьшает ее пористость, вероятность каверны и увеличивает сопротивление.; Вывод: При неизвестном минералогическом составе строят условную колонку по физическим признакам с последующим уточнением по петрофизическим исследованиям образцов.; Вывод: В простых терригенных разрезах задача решается с помощью электрических методов.</desc><rect width="400" height="902" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как по набору кривых каротажа</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">построить геологический разрез</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Построение разреза включает</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">определение границ и толщин</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">пластов и оценку литологической</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">характеристики однородных</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">интервалов.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Литологическую характеристику</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">пород оценивают по сумме</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">признаков на диаграммах</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">различных методов.</text><rect x="16.0" y="388.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Увеличение песчанистости глины</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">уменьшает ее пористость,</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">вероятность каверны и</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">увеличивает сопротивление.</text><line x1="200.0" y1="510.0" x2="200.0" y2="522.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,520.0 L200.0,530.0 L207.0,520.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="550.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="561.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">При неизвестном</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">минералогическом составе строят</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">условную колонку по физическим</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">признакам с последующим</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">уточнением по петрофизическим</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">исследованиям образцов.</text><rect x="16.0" y="741.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">В простых терригенных разрезах</text><text x="28.0" y="790.0" font-size="18" fill="#ECEFF4" text-anchor="start">задача решается с помощью</text><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">электрических методов.</text><rect x="302.0" y="854.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="876.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>