<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 624" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Зачем нужны геофизические исследования в скважинах и как на них влияет бурение</title><desc id="d">Наблюдение: Данные ГИС используются для составления разреза, выделения коллекторов, оценки их толщины, пористости, нефтегазонасыщения, проницаемости и глинистости.; Наблюдение: Первая задача и простейшие случаи коллекторов с межзерновой пористостью решаются качественной интерпретацией.; Наблюдение: В эксплуатационных скважинах по ГИС устанавливают продвижение ВНК и ГЖК в процессе разработки.</desc><rect width="400" height="624" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Зачем нужны геофизические</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">исследования в скважинах и как</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">на них влияет бурение</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Данные ГИС используются для</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">составления разреза, выделения</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">коллекторов, оценки их толщины,</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">пористости, нефтегазонасыщения,</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">проницаемости и глинистости.</text><rect x="16.0" y="283.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Первая задача и простейшие</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">случаи коллекторов с</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">межзерновой пористостью</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">решаются качественной</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">интерпретацией.</text><rect x="16.0" y="438.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">В эксплуатационных скважинах по</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">ГИС устанавливают продвижение</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">ВНК и ГЖК в процессе</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">разработки.</text><rect x="302.0" y="576.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="598.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>