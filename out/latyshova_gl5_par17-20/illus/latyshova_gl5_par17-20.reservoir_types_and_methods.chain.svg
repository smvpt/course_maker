<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 872" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Какие бывают породы-коллекторы и какими приборами их изучают</title><desc id="d">Наблюдение: Основные типы разреза включают терригенный, карбонатный и гидрохимический, а также различные смешанные и вулканогенные типы.; Наблюдение: По морфологии порового пространства коллекторы разделяют на межзерновые, трещинные, кавернозно-трещинные и смешанные типы.; Наблюдение: Комплекс геофизических методов по задачам делится на группы выделения коллекторов, определения пористости, глинистости и оценки продуктивности.; Вывод: Для построения литологического разреза требуются оптимальные параметры промывочной жидкости, репрессии на пласты и полный комплекс геофизических исследований.</desc><rect width="400" height="872" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Какие бывают породы-коллекторы</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">и какими приборами их изучают</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Основные типы разреза включают</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">терригенный, карбонатный и</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">гидрохимический, а также</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">различные смешанные и</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">вулканогенные типы.</text><rect x="16.0" y="258.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">По морфологии порового</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">пространства коллекторы</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">разделяют на межзерновые,</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">трещинные, кавернозно-трещинные</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">и смешанные типы.</text><rect x="16.0" y="413.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">Комплекс геофизических методов</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">по задачам делится на группы</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">выделения коллекторов,</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">определения пористости,</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">глинистости и оценки</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">продуктивности.</text><line x1="200.0" y1="585.0" x2="200.0" y2="597.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,595.0 L200.0,605.0 L207.0,595.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="625.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="636.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для построения литологического</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">разреза требуются оптимальные</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">параметры промывочной жидкости,</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">репрессии на пласты и полный</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">комплекс геофизических</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">исследований.</text><rect x="302.0" y="824.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="846.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>