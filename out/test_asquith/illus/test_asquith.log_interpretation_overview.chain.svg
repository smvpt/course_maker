<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1050" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Зачем нужно переводить данные каротажа в запасы углеводородов</title><desc id="d">Наблюдение: Определение пористости и истинного сопротивления зоны — первый шаг перевода сырых данных каротажа в оценки нефти, газа и воды.; Наблюдение: В данной главе рассматриваются водонасыщенность по Арчи, метод отношений, экспресс-техника, объемная водонасыщенность и кроссплоты насыщения.; Наблюдение: В главе также обсуждаются определение проницаемости по данным каротажа и анализ глинистых коллекторов.; Допущение: Информация по каротажу не должна применяться без включения других данных.; Вывод: Оценки запасов флюидов применяются для оценки зоны и решения о целесообразности попытки окончания скважины.; Вывод: Геолог должен рассматривать все релевантные данные перед принятием решения о спуске обсадных труб.</desc><rect width="400" height="1050" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Зачем нужно переводить данные</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">каротажа в запасы углеводородов</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Определение пористости и</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">истинного сопротивления зоны —</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">первый шаг перевода сырых</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">данных каротажа в оценки нефти,</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">газа и воды.</text><rect x="16.0" y="258.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">В данной главе рассматриваются</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенность по Арчи, метод</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">отношений, экспресс-техника,</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">объемная водонасыщенность и</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">кроссплоты насыщения.</text><rect x="16.0" y="413.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">В главе также обсуждаются</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">определение проницаемости по</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">данным каротажа и анализ</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">глинистых коллекторов.</text><line x1="200.0" y1="535.0" x2="200.0" y2="547.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,545.0 L200.0,555.0 L207.0,545.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="575.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="586.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">Информация по каротажу не</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">должна применяться без</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">включения других данных.</text><line x1="200.0" y1="683.0" x2="200.0" y2="695.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,693.0 L200.0,703.0 L207.0,693.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="723.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="734.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">Оценки запасов флюидов</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">применяются для оценки зоны и</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">решения о целесообразности</text><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">попытки окончания скважины.</text><rect x="16.0" y="864.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">Геолог должен рассматривать все</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">релевантные данные перед</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">принятием решения о спуске</text><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">обсадных труб.</text><rect x="302.0" y="1002.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1024.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>