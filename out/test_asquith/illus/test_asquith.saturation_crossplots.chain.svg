<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 674" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Графические методы определения параметров пласта по кроссплотам</title><desc id="d">Наблюдение: Кроссплоты насыщения или кроссплоты сопротивления-пористости являются графическими решениями уравнения водонасыщенности Арчи.; Наблюдение: Метод Пикетта оценивает водонасыщенность, сопротивление воды, цементационный фактор и параметры матрицы для акустического и плотностного каротажа.; Наблюдение: В методе Пикетта истинное сопротивление и пористость откладываются в логарифмических масштабах.</desc><rect width="400" height="674" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Графические методы определения</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">параметров пласта по</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">кроссплотам</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Кроссплоты насыщения или</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">кроссплоты</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивления-пористости</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">являются графическими решениями</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнения водонасыщенности</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">Арчи.</text><rect x="16.0" y="308.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Метод Пикетта оценивает</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенность, сопротивление</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">воды, цементационный фактор и</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">параметры матрицы для</text><text x="28.0" y="432.0" font-size="18" fill="#ECEFF4" text-anchor="start">акустического и плотностного</text><text x="28.0" y="457.0" font-size="18" fill="#ECEFF4" text-anchor="start">каротажа.</text><rect x="16.0" y="488.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">В методе Пикетта истинное</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивление и пористость</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">откладываются в логарифмических</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">масштабах.</text><rect x="302.0" y="626.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="648.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>