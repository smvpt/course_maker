<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1075" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как рассчитать проницаемость пласта по пористости и связанной воде</title><desc id="d">Наблюдение: Формулы проницаемости по данным ГИС применимы только для оценки проницаемости в пластах с неснижаемой водонасыщенностью.; Наблюдение: При постоянных значениях объемной водонасыщенности пласт находится в состоянии неснижаемой водонасыщенности.; Наблюдение: Метод Вилли-Роуза использует палетку или две формулы для нефти средней плотности и сухого газа.; Допущение: Формула Вилли-Роуза для нефти средней плотности имеет вид K = (250 * phi^3 / S_wirr)^2.; Вывод: Оценку проницаемости следует сравнивать с данными соседних скважин с хорошей и плохой историей добычи.; Вывод: Если значения объемной водонасыщенности не постоянны, зона не находится в состоянии неснижаемой водонасыщенности, и оценки проницаемости сомнительны.</desc><rect width="400" height="1075" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как рассчитать проницаемость</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">пласта по пористости и</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">связанной воде</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Формулы проницаемости по данным</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">ГИС применимы только для оценки</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">проницаемости в пластах с</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">неснижаемой водонасыщенностью.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">При постоянных значениях</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">объемной водонасыщенности пласт</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">находится в состоянии</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">неснижаемой водонасыщенности.</text><rect x="16.0" y="388.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Метод Вилли-Роуза использует</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">палетку или две формулы для</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">нефти средней плотности и</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">сухого газа.</text><line x1="200.0" y1="510.0" x2="200.0" y2="522.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,520.0 L200.0,530.0 L207.0,520.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="550.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="561.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">Формула Вилли-Роуза для нефти</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">средней плотности имеет вид K =</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">(250 * phi^3 / S_wirr)^2.</text><line x1="200.0" y1="658.0" x2="200.0" y2="670.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,668.0 L200.0,678.0 L207.0,668.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="698.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="709.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="733.0" font-size="18" fill="#ECEFF4" text-anchor="start">Оценку проницаемости следует</text><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">сравнивать с данными соседних</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважин с хорошей и плохой</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">историей добычи.</text><rect x="16.0" y="839.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="863.0" font-size="18" fill="#ECEFF4" text-anchor="start">Если значения объемной</text><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенности не постоянны,</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">зона не находится в состоянии</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">неснижаемой водонасыщенности, и</text><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">оценки проницаемости</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">сомнительны.</text><rect x="302.0" y="1027.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1049.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>