<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 852" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как рассчитать насыщенность воды в неизмененной и промытой зонах</title><desc id="d">Наблюдение: Водонасыщенность неизмененной зоны рассчитывается по формуле Арчи 1942 года.; Наблюдение: Формула Арчи для водонасыщенности неизмененной зоны включает сопротивление воды, истинное сопротивление пласта и пористость.; Наблюдение: Параметр Rw обозначает удельное сопротивление пластовой воды при пластовой температуре.; Вывод: Водонасыщенность неизмененной зоны по уравнению Арчи является важнейшей базовой величиной в оценке каротажа.; Вывод: Знание одной лишь водонасыщенности недостаточно для полной оценки потенциальной продуктивности интервала.</desc><rect width="400" height="852" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как рассчитать насыщенность</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">воды в неизмененной и промытой</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">зонах</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Водонасыщенность неизмененной</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">зоны рассчитывается по формуле</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">Арчи 1942 года.</text><rect x="16.0" y="233.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">Формула Арчи для</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенности неизмененной</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">зоны включает сопротивление</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">воды, истинное сопротивление</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">пласта и пористость.</text><rect x="16.0" y="388.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Параметр Rw обозначает удельное</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивление пластовой воды</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">при пластовой температуре.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="536.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Водонасыщенность неизмененной</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">зоны по уравнению Арчи является</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">важнейшей базовой величиной в</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">оценке каротажа.</text><rect x="16.0" y="666.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="690.0" font-size="18" fill="#ECEFF4" text-anchor="start">Знание одной лишь</text><text x="28.0" y="715.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенности недостаточно</text><text x="28.0" y="740.0" font-size="18" fill="#ECEFF4" text-anchor="start">для полной оценки потенциальной</text><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">продуктивности интервала.</text><rect x="302.0" y="804.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="826.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>