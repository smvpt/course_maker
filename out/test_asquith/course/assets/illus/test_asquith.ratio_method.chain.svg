<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как оценить подвижные углеводороды без знания пористости</title><desc id="d">Наблюдение: Метод отношений идентифицирует углеводороды по разнице водонасыщенностей промытой и неизмененной зон.; Наблюдение: Если отношение Sw/Sxo равно или больше 1.0, углеводороды не перемещались при вторжении.; Наблюдение: Значение отношения Sw/Sxo менее 0.7 для песчаников или менее 0.6 для карбонатов указывает на подвижные углеводороды.; Допущение: Цементирующий коэффициент n в методе принимается равным 2.0.; Вывод: Формула отношения 7.3 получается делением уравнения Арчи для неизмененной зоны на уравнение для промытой зоны.; Вывод: При делении Sw на Sxo коэффициент пористости сокращается, позволяя вычислить индекс подвижных углеводородов без данных пористости.</desc><rect width="400" height="1000" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как оценить подвижные</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">углеводороды без знания</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">пористости</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Метод отношений идентифицирует</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">углеводороды по разнице</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенностей промытой и</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">неизмененной зон.</text><rect x="16.0" y="258.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Если отношение Sw/Sxo равно или</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">больше 1.0, углеводороды не</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">перемещались при вторжении.</text><rect x="16.0" y="363.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="387.0" font-size="18" fill="#ECEFF4" text-anchor="start">Значение отношения Sw/Sxo менее</text><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">0.7 для песчаников или менее</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">0.6 для карбонатов указывает на</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">подвижные углеводороды.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="536.0" width="368.0" height="70.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Цементирующий коэффициент n в</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">методе принимается равным 2.0.</text><line x1="200.0" y1="608.0" x2="200.0" y2="620.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,618.0 L200.0,628.0 L207.0,618.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="648.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="659.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="683.0" font-size="18" fill="#ECEFF4" text-anchor="start">Формула отношения 7.3</text><text x="28.0" y="708.0" font-size="18" fill="#ECEFF4" text-anchor="start">получается делением уравнения</text><text x="28.0" y="733.0" font-size="18" fill="#ECEFF4" text-anchor="start">Арчи для неизмененной зоны на</text><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнение для промытой зоны.</text><rect x="16.0" y="789.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="813.0" font-size="18" fill="#ECEFF4" text-anchor="start">При делении Sw на Sxo</text><text x="28.0" y="838.0" font-size="18" fill="#ECEFF4" text-anchor="start">коэффициент пористости</text><text x="28.0" y="863.0" font-size="18" fill="#ECEFF4" text-anchor="start">сокращается, позволяя вычислить</text><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">индекс подвижных углеводородов</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">без данных пористости.</text><rect x="302.0" y="952.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="974.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>