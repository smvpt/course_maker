<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как проверить, находится ли пласт в равновесии и свободен ли от воды</title><desc id="d">Наблюдение: Произведение водной насыщенности пласта и его пористости является объемной водонасыщенностью.; Наблюдение: Объемная водонасыщенность рассчитывается как произведение Sw на пористость.; Наблюдение: Пласт, не достигающий остаточной водонасыщенности, демонстрирует большие вариации значений объемной воды.; Допущение: Значения BVW для карбонатов следует использовать только как очень общий ориентир для различных типов пористости.; Вывод: Постоянные или близкие к постоянным значения BVW на разных глубинах указывают на единый тип породы и остаточную водонасыщенность.; Вывод: При остаточной водонасыщенности вода в невнедренной зоне неподвижна, так как удерживается на зернах капиллярным давлением, поэтому приток должен быть безводным.</desc><rect width="400" height="1100" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как проверить, находится ли</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">пласт в равновесии и свободен</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">ли от воды</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Произведение водной</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">насыщенности пласта и его</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">пористости является объемной</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенностью.</text><rect x="16.0" y="258.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Объемная водонасыщенность</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">рассчитывается как произведение</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Sw на пористость.</text><rect x="16.0" y="363.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="387.0" font-size="18" fill="#ECEFF4" text-anchor="start">Пласт, не достигающий</text><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">остаточной водонасыщенности,</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">демонстрирует большие вариации</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">значений объемной воды.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="536.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Значения BVW для карбонатов</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">следует использовать только как</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">очень общий ориентир для</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">различных типов пористости.</text><line x1="200.0" y1="658.0" x2="200.0" y2="670.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,668.0 L200.0,678.0 L207.0,668.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="698.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="709.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="733.0" font-size="18" fill="#ECEFF4" text-anchor="start">Постоянные или близкие к</text><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">постоянным значения BVW на</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">разных глубинах указывают на</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">единый тип породы и остаточную</text><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенность.</text><rect x="16.0" y="864.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">При остаточной водонасыщенности</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">вода в невнедренной зоне</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">неподвижна, так как</text><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">удерживается на зернах</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">капиллярным давлением, поэтому</text><text x="28.0" y="1013.0" font-size="18" fill="#ECEFF4" text-anchor="start">приток должен быть безводным.</text><rect x="302.0" y="1052.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1074.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>