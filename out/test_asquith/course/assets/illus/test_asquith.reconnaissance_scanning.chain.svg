<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 847" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как быстро отличить пласты-коллекторы от не-коллекторов по кривым</title><desc id="d">Наблюдение: Сканирование разреза помогает быстро отделить коллектор от неколлектора и выделить потенциальные продуктивные и водяные зоны.; Наблюдение: В терригенных отложениях кривая сопротивления является основным инструментом сканирования из-за вмещающих пород с относительно постоянным сопротивлением.; Наблюдение: В карбонатных породах сопротивление сильно меняется при смене литологии, поэтому основным инструментом сканирования служит кривая пористости.; Вывод: Идентификация водяных зон так же важна, как и поиск углеводородов, для оценки их присутствия и объема.</desc><rect width="400" height="847" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как быстро отличить</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">пласты-коллекторы от</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">не-коллекторов по кривым</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Сканирование разреза помогает</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">быстро отделить коллектор от</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">неколлектора и выделить</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">потенциальные продуктивные и</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">водяные зоны.</text><rect x="16.0" y="283.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">В терригенных отложениях кривая</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивления является основным</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">инструментом сканирования из-за</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">вмещающих пород с относительно</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">постоянным сопротивлением.</text><rect x="16.0" y="438.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">В карбонатных породах</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивление сильно меняется</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">при смене литологии, поэтому</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">основным инструментом</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">сканирования служит кривая</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">пористости.</text><line x1="200.0" y1="610.0" x2="200.0" y2="622.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,620.0 L200.0,630.0 L207.0,620.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="650.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="661.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">Идентификация водяных зон так</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">же важна, как и поиск</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">углеводородов, для оценки их</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">присутствия и объема.</text><rect x="302.0" y="799.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="821.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>