<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1025" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Быстрые визуальные индикаторы углеводородов по кривым</title><desc id="d">Наблюдение: Экспресс-методы дают индикаторы для поиска возможных зон скопления углеводородов.; Наблюдение: Рассматриваются четыре экспресс-метода: отношение Rxo/Rt, кажущееся удельное сопротивление воды, проводимостная пористость и влажное сопротивление.; Наблюдение: Метод Rxo/Rt опирается на сравнение кривой отношения сопротивлений и кривой SP.; Допущение: Минимальное значение Rwa принимается за истинное сопротивление пластовой воды, а большие значения указывают на углеводороды.; Вывод: Отношение Rxo/Ro связано с SP через постоянную формулу с логарифмом отношения Rmf к Rw.; Вывод: В нефтеносном интервале Rt растет, из-за чего отношение Rxo/Rt уменьшается и кривая уходит от SP.</desc><rect width="400" height="1025" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Быстрые визуальные индикаторы</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">углеводородов по кривым</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Экспресс-методы дают индикаторы</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">для поиска возможных зон</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">скопления углеводородов.</text><rect x="16.0" y="208.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="232.0" font-size="18" fill="#ECEFF4" text-anchor="start">Рассматриваются четыре</text><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">экспресс-метода: отношение</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Rxo/Rt, кажущееся удельное</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивление воды,</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">проводимостная пористость и</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">влажное сопротивление.</text><rect x="16.0" y="388.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Метод Rxo/Rt опирается на</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">сравнение кривой отношения</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивлений и кривой SP.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="536.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Минимальное значение Rwa</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">принимается за истинное</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивление пластовой воды, а</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">большие значения указывают на</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">углеводороды.</text><line x1="200.0" y1="683.0" x2="200.0" y2="695.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,693.0 L200.0,703.0 L207.0,693.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="723.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="734.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">Отношение Rxo/Ro связано с SP</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">через постоянную формулу с</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">логарифмом отношения Rmf к Rw.</text><rect x="16.0" y="839.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="863.0" font-size="18" fill="#ECEFF4" text-anchor="start">В нефтеносном интервале Rt</text><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">растет, из-за чего отношение</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">Rxo/Rt уменьшается и кривая</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">уходит от SP.</text><rect x="302.0" y="977.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="999.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>