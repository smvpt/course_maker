<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1052" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как наличие глины искажает данные каротажа и как с этим бороться</title><desc id="d">Наблюдение: В ранней литературе формирования с глинами и сланцами называли shaly sands, а для учета их эффектов в уравнение Арчи вводили объем сланца.; Наблюдение: В интерпретации термины volume сланца и глины часто используют как взаимозаменяемые, хотя большинство методов нацелены на объём сланца.; Наблюдение: Работы Waxman-Smits и Waxman-Thomas помогли понять физические причины отклика геофизических приборов в глинистых коллекторах.; Вывод: Геологические исследования показали разницу между сланцем (shale) и глиной (clay); глинистые пески обычно содержат именно глины, отличные от окружающих сланцев.; Вывод: Методы Waxman-Smits и dual water используют электрические свойства глинистых минералов для прогноза точной водонасыщенности.</desc><rect width="400" height="1052" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как наличие глины искажает</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">данные каротажа и как с этим</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">бороться</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">В ранней литературе</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">формирования с глинами и</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">сланцами называли shaly sands,</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">а для учета их эффектов в</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнение Арчи вводили объем</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">сланца.</text><rect x="16.0" y="308.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">В интерпретации термины volume</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">сланца и глины часто используют</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">как взаимозаменяемые, хотя</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">большинство методов нацелены на</text><text x="28.0" y="432.0" font-size="18" fill="#ECEFF4" text-anchor="start">объём сланца.</text><rect x="16.0" y="463.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">Работы Waxman-Smits и</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">Waxman-Thomas помогли понять</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">физические причины отклика</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">геофизических приборов в</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">глинистых коллекторах.</text><line x1="200.0" y1="610.0" x2="200.0" y2="622.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,620.0 L200.0,630.0 L207.0,620.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="650.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="661.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">Геологические исследования</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">показали разницу между сланцем</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">(shale) и глиной (clay);</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">глинистые пески обычно содержат</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">именно глины, отличные от</text><text x="28.0" y="810.0" font-size="18" fill="#ECEFF4" text-anchor="start">окружающих сланцев.</text><rect x="16.0" y="841.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="865.0" font-size="18" fill="#ECEFF4" text-anchor="start">Методы Waxman-Smits и dual</text><text x="28.0" y="890.0" font-size="18" fill="#ECEFF4" text-anchor="start">water используют электрические</text><text x="28.0" y="915.0" font-size="18" fill="#ECEFF4" text-anchor="start">свойства глинистых минералов</text><text x="28.0" y="940.0" font-size="18" fill="#ECEFF4" text-anchor="start">для прогноза точной</text><text x="28.0" y="965.0" font-size="18" fill="#ECEFF4" text-anchor="start">водонасыщенности.</text><rect x="302.0" y="1004.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1026.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>