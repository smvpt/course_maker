<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 897" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Точные решения для плоского пласта и движение границы давления</title><desc id="d">Наблюдение: В полубесконечном пласте при мгновенном снижении давления на галерее образуется неустановившийся прямолинейно-параллельный поток упругой жидкости.; Наблюдение: Одномерное уравнение пьезопроводности в декартовой системе координат записывается через частные производные давления по времени и координате.; Вывод: Анализ размерностей показывает автомодельность задачи, сводя аргументы к безразмерному комплексу x над корнем из каппа t.; Вывод: Закон распределения давления в неустановившемся прямолинейно-параллельном потоке выражается через функцию ошибок erf.</desc><rect width="400" height="897" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Точные решения для плоского</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">пласта и движение границы</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">давления</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">В полубесконечном пласте при</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">мгновенном снижении давления на</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">галерее образуется</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">неустановившийся</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">прямолинейно-параллельный поток</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">упругой жидкости.</text><rect x="16.0" y="308.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Одномерное уравнение</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">пьезопроводности в декартовой</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">системе координат записывается</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">через частные производные</text><text x="28.0" y="432.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления по времени и</text><text x="28.0" y="457.0" font-size="18" fill="#ECEFF4" text-anchor="start">координате.</text><line x1="200.0" y1="480.0" x2="200.0" y2="492.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,490.0 L200.0,500.0 L207.0,490.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="520.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="531.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="555.0" font-size="18" fill="#ECEFF4" text-anchor="start">Анализ размерностей показывает</text><text x="28.0" y="580.0" font-size="18" fill="#ECEFF4" text-anchor="start">автомодельность задачи, сводя</text><text x="28.0" y="605.0" font-size="18" fill="#ECEFF4" text-anchor="start">аргументы к безразмерному</text><text x="28.0" y="630.0" font-size="18" fill="#ECEFF4" text-anchor="start">комплексу x над корнем из каппа</text><text x="28.0" y="655.0" font-size="18" fill="#ECEFF4" text-anchor="start">t.</text><rect x="16.0" y="686.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">Закон распределения давления в</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">неустановившемся</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">прямолинейно-параллельном</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">потоке выражается через функцию</text><text x="28.0" y="810.0" font-size="18" fill="#ECEFF4" text-anchor="start">ошибок erf.</text><rect x="302.0" y="849.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="871.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>