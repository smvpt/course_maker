<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1075" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Что такое упругий режим и откуда берется энергия пласта</title><desc id="d">Наблюдение: При разработке месторождений возникают неустановившиеся процессы с перераспределением давления и изменением скоростей и дебитов.; Наблюдение: Движение жидкости при упругом режиме начинается сначала у забоя, а затем во всё более удаленных областях пласта.; Наблюдение: Приток жидкости может поддерживаться напором воды из области питания, образуя упруговодонапорный режим.; Допущение: Математическая модель учитывает упругие силы в однофазном потоке при давлении выше давления насыщения газом.; Вывод: Количественные характеристики неустановившихся процессов зависят от упругих свойств пластов и жидкостей.; Вывод: Основная форма энергии при неустановившихся процессах — энергия упругой деформации жидкостей и твердого скелета пласта.</desc><rect width="400" height="1075" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Что такое упругий режим и</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">откуда берется энергия пласта</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">При разработке месторождений</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">возникают неустановившиеся</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">процессы с перераспределением</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления и изменением скоростей</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">и дебитов.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Движение жидкости при упругом</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">режиме начинается сначала у</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">забоя, а затем во всё более</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">удаленных областях пласта.</text><rect x="16.0" y="388.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Приток жидкости может</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">поддерживаться напором воды из</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">области питания, образуя</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">упруговодонапорный режим.</text><line x1="200.0" y1="510.0" x2="200.0" y2="522.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,520.0 L200.0,530.0 L207.0,520.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="550.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="561.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">Математическая модель учитывает</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">упругие силы в однофазном</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">потоке при давлении выше</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления насыщения газом.</text><line x1="200.0" y1="683.0" x2="200.0" y2="695.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,693.0 L200.0,703.0 L207.0,693.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="723.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="734.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">Количественные характеристики</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">неустановившихся процессов</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">зависят от упругих свойств</text><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">пластов и жидкостей.</text><rect x="16.0" y="864.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">Основная форма энергии при</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">неустановившихся процессах —</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">энергия упругой деформации</text><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">жидкостей и твердого скелета</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">пласта.</text><rect x="302.0" y="1027.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1049.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>