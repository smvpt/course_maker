<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 945" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как рассчитать количество нефти и воды за счет упругости пласта</title><desc id="d">Наблюдение: Под упругим запасом жидкости понимают количество извлекаемой жидкости при снижении давления за счет упругости скелета и флюидов.; Наблюдение: Изменение объема жидкости и объема пор при изменении давления выражается через коэффициенты упругости.; Допущение: Начальный объем жидкости в элементе пласта равен полному объему пор.; Вывод: В упругом режиме при падении давления объем жидкости уменьшается под воздействием сжимающего скелета, поэтому знак минус перед коэффициентом упругости жидкости опускается.; Вывод: Коэффициент упругоемкости пласта равен сумме произведений пористости на сжимаемость жидкости и сжимаемости скелета.</desc><rect width="400" height="945" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как рассчитать количество нефти</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">и воды за счет упругости пласта</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Под упругим запасом жидкости</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">понимают количество извлекаемой</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">жидкости при снижении давления</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">за счет упругости скелета и</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">флюидов.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Изменение объема жидкости и</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">объема пор при изменении</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления выражается через</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">коэффициенты упругости.</text><line x1="200.0" y1="380.0" x2="200.0" y2="392.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,390.0 L200.0,400.0 L207.0,390.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="420.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="431.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="455.0" font-size="18" fill="#ECEFF4" text-anchor="start">Начальный объем жидкости в</text><text x="28.0" y="480.0" font-size="18" fill="#ECEFF4" text-anchor="start">элементе пласта равен полному</text><text x="28.0" y="505.0" font-size="18" fill="#ECEFF4" text-anchor="start">объему пор.</text><line x1="200.0" y1="528.0" x2="200.0" y2="540.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,538.0 L200.0,548.0 L207.0,538.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="568.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="579.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="603.0" font-size="18" fill="#ECEFF4" text-anchor="start">В упругом режиме при падении</text><text x="28.0" y="628.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления объем жидкости</text><text x="28.0" y="653.0" font-size="18" fill="#ECEFF4" text-anchor="start">уменьшается под воздействием</text><text x="28.0" y="678.0" font-size="18" fill="#ECEFF4" text-anchor="start">сжимающего скелета, поэтому</text><text x="28.0" y="703.0" font-size="18" fill="#ECEFF4" text-anchor="start">знак минус перед коэффициентом</text><text x="28.0" y="728.0" font-size="18" fill="#ECEFF4" text-anchor="start">упругости жидкости опускается.</text><rect x="16.0" y="759.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">Коэффициент упругоемкости</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">пласта равен сумме произведений</text><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">пористости на сжимаемость</text><text x="28.0" y="858.0" font-size="18" fill="#ECEFF4" text-anchor="start">жидкости и сжимаемости скелета.</text><rect x="302.0" y="897.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="919.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>