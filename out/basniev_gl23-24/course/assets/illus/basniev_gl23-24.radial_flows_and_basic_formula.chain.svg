<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1077" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Решение для радиального притока к скважине и интегральная показательная функция</title><desc id="d">Наблюдение: В неограниченном горизонтальном пласте постоянной толщины при пуске скважины с постоянным объемным дебитом образуется неустановившийся плоскорадиальный поток упругой жидкости.; Наблюдение: Распределение давления в пласте определяется интегрированием уравнения пьезопроводности для цилиндрической системы координат.; Наблюдение: Основная формула теории упругого режима фильтрации выражает давление через интегральную показательную функцию и применяется в расчетах и при интерпретации исследований скважин.; Вывод: Задача является автомодельной, так как приведенное безразмерное давление зависит только от двух безразмерных параметров.; Вывод: Интегрирование дифференциального уравнения с учетом граничных условий приводит к выражению распределения давления через интегральную показательную функцию.</desc><rect width="400" height="1077" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Решение для радиального притока</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">к скважине и интегральная</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">показательная функция</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">В неограниченном горизонтальном</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">пласте постоянной толщины при</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">пуске скважины с постоянным</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">объемным дебитом образуется</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">неустановившийся</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">плоскорадиальный поток упругой…</text><rect x="16.0" y="308.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Распределение давления в пласте</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">определяется интегрированием</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнения пьезопроводности для</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">цилиндрической системы</text><text x="28.0" y="432.0" font-size="18" fill="#ECEFF4" text-anchor="start">координат.</text><rect x="16.0" y="463.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">Основная формула теории</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">упругого режима фильтрации</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">выражает давление через</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">интегральную показательную</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">функцию и применяется в</text><text x="28.0" y="612.0" font-size="18" fill="#ECEFF4" text-anchor="start">расчетах и при интерпретации…</text><line x1="200.0" y1="635.0" x2="200.0" y2="647.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,645.0 L200.0,655.0 L207.0,645.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="675.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="686.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">Задача является автомодельной,</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">так как приведенное</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">безразмерное давление зависит</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">только от двух безразмерных</text><text x="28.0" y="810.0" font-size="18" fill="#ECEFF4" text-anchor="start">параметров.</text><rect x="16.0" y="841.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="865.0" font-size="18" fill="#ECEFF4" text-anchor="start">Интегрирование</text><text x="28.0" y="890.0" font-size="18" fill="#ECEFF4" text-anchor="start">дифференциального уравнения с</text><text x="28.0" y="915.0" font-size="18" fill="#ECEFF4" text-anchor="start">учетом граничных условий</text><text x="28.0" y="940.0" font-size="18" fill="#ECEFF4" text-anchor="start">приводит к выражению</text><text x="28.0" y="965.0" font-size="18" fill="#ECEFF4" text-anchor="start">распределения давления через</text><text x="28.0" y="990.0" font-size="18" fill="#ECEFF4" text-anchor="start">интегральную показательную…</text><rect x="302.0" y="1029.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1051.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>