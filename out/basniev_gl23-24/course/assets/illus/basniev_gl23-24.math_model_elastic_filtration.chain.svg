<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1050" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Система уравнений для упругого потока в пористой среде</title><desc id="d">Наблюдение: Изучение гидродинамики упругого режима фильтрации важно для теории и практики разработки месторождений углеводородов.; Наблюдение: При естественном упругом режиме добывается до 2-5% извлекаемых запасов, но на месторождении Тенгиз доля достигает 20%.; Наблюдение: Основное дифференциальное уравнение теории упругого режима фильтрации названо уравнением пьезопроводности.; Допущение: Для вывода уравнений фильтрации используют уравнение неразрывности, закон Дарси и уравнения состояния.; Вывод: Знание основ упругого режима позволяет использовать упругий запас флюидов для притока и решать обратные задачи.; Вывод: Учет зависимости проницаемости от деформаций усложняет модель, поэтому используется традиционный подход с константами.</desc><rect width="400" height="1050" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Система уравнений для упругого</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">потока в пористой среде</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Изучение гидродинамики упругого</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">режима фильтрации важно для</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">теории и практики разработки</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">месторождений углеводородов.</text><rect x="16.0" y="233.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">При естественном упругом режиме</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">добывается до 2-5% извлекаемых</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">запасов, но на месторождении</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Тенгиз доля достигает 20%.</text><rect x="16.0" y="363.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="387.0" font-size="18" fill="#ECEFF4" text-anchor="start">Основное дифференциальное</text><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнение теории упругого</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">режима фильтрации названо</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнением пьезопроводности.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="536.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для вывода уравнений фильтрации</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">используют уравнение</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">неразрывности, закон Дарси и</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнения состояния.</text><line x1="200.0" y1="658.0" x2="200.0" y2="670.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,668.0 L200.0,678.0 L207.0,668.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="698.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="709.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="733.0" font-size="18" fill="#ECEFF4" text-anchor="start">Знание основ упругого режима</text><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">позволяет использовать упругий</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">запас флюидов для притока и</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">решать обратные задачи.</text><rect x="16.0" y="839.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="863.0" font-size="18" fill="#ECEFF4" text-anchor="start">Учет зависимости проницаемости</text><text x="28.0" y="888.0" font-size="18" fill="#ECEFF4" text-anchor="start">от деформаций усложняет модель,</text><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">поэтому используется</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">традиционный подход с</text><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">константами.</text><rect x="302.0" y="1002.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1024.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>