<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1150" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Упрощенный расчет нестационарных процессов через стационарные состояния</title><desc id="d">Наблюдение: Решения краевых задач неустановившейся фильтрации часто громоздки, поэтому разработаны приближенные методы.; Наблюдение: Процесс перераспределения давления протекает в две фазы, где в первой фазе граница возмущенной области расширяется.; Наблюдение: Для бесконечного пласта рассматривается только первая фаза без ограничения продолжительности.; Допущение: Метод ПССС разработан И.А. Чарным и основан на предположении, что давление меняется во времени медленнее, чем по координатам.; Вывод: Закон движения подвижной границы определяется через уравнение материального баланса и граничные условия.; Вывод: Методом ПССС лучше пользоваться в случае неустановившихся прямолинейно-параллельных потоков при заданной постоянной депрессии.</desc><rect width="400" height="1150" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Упрощенный расчет</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">нестационарных процессов через</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">стационарные состояния</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Решения краевых задач</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">неустановившейся фильтрации</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">часто громоздки, поэтому</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">разработаны приближенные</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">методы.</text><rect x="16.0" y="283.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Процесс перераспределения</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления протекает в две фазы,</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">где в первой фазе граница</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">возмущенной области</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">расширяется.</text><rect x="16.0" y="438.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для бесконечного пласта</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">рассматривается только первая</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">фаза без ограничения</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">продолжительности.</text><line x1="200.0" y1="560.0" x2="200.0" y2="572.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,570.0 L200.0,580.0 L207.0,570.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="600.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="611.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">Метод ПССС разработан И.А.</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">Чарным и основан на</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">предположении, что давление</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">меняется во времени медленнее,</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">чем по координатам.</text><line x1="200.0" y1="758.0" x2="200.0" y2="770.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,768.0 L200.0,778.0 L207.0,768.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="798.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="809.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">Закон движения подвижной</text><text x="28.0" y="858.0" font-size="18" fill="#ECEFF4" text-anchor="start">границы определяется через</text><text x="28.0" y="883.0" font-size="18" fill="#ECEFF4" text-anchor="start">уравнение материального баланса</text><text x="28.0" y="908.0" font-size="18" fill="#ECEFF4" text-anchor="start">и граничные условия.</text><rect x="16.0" y="939.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">Методом ПССС лучше пользоваться</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">в случае неустановившихся</text><text x="28.0" y="1013.0" font-size="18" fill="#ECEFF4" text-anchor="start">прямолинейно-параллельных</text><text x="28.0" y="1038.0" font-size="18" fill="#ECEFF4" text-anchor="start">потоков при заданной постоянной</text><text x="28.0" y="1063.0" font-size="18" fill="#ECEFF4" text-anchor="start">депрессии.</text><rect x="302.0" y="1102.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1124.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>