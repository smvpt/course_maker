<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1002" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как формируются ловушки для нефти в рифах и как их правильно разведовать</title><desc id="d">Наблюдение: Перекрытие рифов непроницаемыми толщами-флюидоупорами часто обусловлено палеогеографическими и палеотектоническими условиями рифообразования.; Наблюдение: Рост рифов происходит в эпохи трансгрессий или повышения уровня моря, сопровождающегося карбонатонакоплением.; Наблюдение: Прекращение образования рифов связано с регрессией и падением уровня моря, а регрессивные серии представлены непроницаемыми породами.; Вывод: Отложение непроницаемых пород вслед за рифообразованием обусловливает формирование замкнутого объема, то есть ловушки.; Вывод: Максимальная высота и объем ловушки определяются величиной превышения рифа над внерифовыми отложениями при перекрытии покрышкой.</desc><rect width="400" height="1002" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как формируются ловушки для</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">нефти в рифах и как их</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">правильно разведовать</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Перекрытие рифов непроницаемыми</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">толщами-флюидоупорами часто</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">обусловлено</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">палеогеографическими и</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">палеотектоническими условиями</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">рифообразования.</text><rect x="16.0" y="308.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Рост рифов происходит в эпохи</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">трансгрессий или повышения</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">уровня моря, сопровождающегося</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">карбонатонакоплением.</text><rect x="16.0" y="438.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">Прекращение образования рифов</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">связано с регрессией и падением</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">уровня моря, а регрессивные</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">серии представлены</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">непроницаемыми породами.</text><line x1="200.0" y1="585.0" x2="200.0" y2="597.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,595.0 L200.0,605.0 L207.0,595.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="625.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="636.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">Отложение непроницаемых пород</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">вслед за рифообразованием</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">обусловливает формирование</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">замкнутого объема, то есть</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">ловушки.</text><rect x="16.0" y="791.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">Максимальная высота и объем</text><text x="28.0" y="840.0" font-size="18" fill="#ECEFF4" text-anchor="start">ловушки определяются величиной</text><text x="28.0" y="865.0" font-size="18" fill="#ECEFF4" text-anchor="start">превышения рифа над внерифовыми</text><text x="28.0" y="890.0" font-size="18" fill="#ECEFF4" text-anchor="start">отложениями при перекрытии</text><text x="28.0" y="915.0" font-size="18" fill="#ECEFF4" text-anchor="start">покрышкой.</text><rect x="302.0" y="954.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="976.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>