<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 927" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Из каких пород состоят рифы и как в них появляются пустоты для нефти</title><desc id="d">Наблюдение: Для геологов-нефтяников наибольший интерес представляют рифы в узком буквальном смысле этого слова.; Наблюдение: Рифы различаются по морфологии, тектонической и палеогеографической позиции в бассейне.; Наблюдение: Выделяется два основных типа рифов: одиночные рифы и асимметричные рифовые системы.; Вывод: Различные литологические типы пород и фаунистические сообщества закономерно и резко зонально располагаются в теле рифа из-за расчлененности рельефа.; Вывод: Зональность рифов обусловлена разницей рельефа, гидродинамики и освещенности между мелководным гребнем и глубоководными склонами.</desc><rect width="400" height="927" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Из каких пород состоят рифы и</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">как в них появляются пустоты</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">для нефти</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для геологов-нефтяников</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">наибольший интерес представляют</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">рифы в узком буквальном смысле</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">этого слова.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Рифы различаются по морфологии,</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">тектонической и</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">палеогеографической позиции в</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">бассейне.</text><rect x="16.0" y="388.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Выделяется два основных типа</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">рифов: одиночные рифы и</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">асимметричные рифовые системы.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="536.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Различные литологические типы</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">пород и фаунистические</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">сообщества закономерно и резко</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">зонально располагаются в теле</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">рифа из-за расчлененности</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">рельефа.</text><rect x="16.0" y="716.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="740.0" font-size="18" fill="#ECEFF4" text-anchor="start">Зональность рифов обусловлена</text><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">разницей рельефа, гидродинамики</text><text x="28.0" y="790.0" font-size="18" fill="#ECEFF4" text-anchor="start">и освещенности между</text><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">мелководным гребнем и</text><text x="28.0" y="840.0" font-size="18" fill="#ECEFF4" text-anchor="start">глубоководными склонами.</text><rect x="302.0" y="879.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="901.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>