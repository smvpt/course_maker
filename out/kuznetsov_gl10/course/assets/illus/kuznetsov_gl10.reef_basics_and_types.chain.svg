<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 722" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Что такое рифы, почему в них много нефти и чем они отличаются</title><desc id="d">Наблюдение: Рифы составляют малую долю осадочных образований, но содержат 10-12% мировых запасов углеводородов.; Наблюдение: Высота залежей на месторождении Карачаганак превышает 1500 м, а в зоне Ла Реформа составляет 900-2100 м.; Наблюдение: Органогенная постройка — геологическое образование, созданное нараставшими друг на друга организмами.; Вывод: Неправильное понимание рифов приводит к поисково-разведочным работам в областях, где их нет.</desc><rect width="400" height="722" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Что такое рифы, почему в них</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">много нефти и чем они</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">отличаются</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Рифы составляют малую долю</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">осадочных образований, но</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">содержат 10-12% мировых запасов</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">углеводородов.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Высота залежей на месторождении</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Карачаганак превышает 1500 м, а</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">в зоне Ла Реформа составляет</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">900-2100 м.</text><rect x="16.0" y="388.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Органогенная постройка —</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">геологическое образование,</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">созданное нараставшими друг на</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">друга организмами.</text><line x1="200.0" y1="510.0" x2="200.0" y2="522.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,520.0 L200.0,530.0 L207.0,520.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="550.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="561.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">Неправильное понимание рифов</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">приводит к поисково-разведочным</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">работам в областях, где их нет.</text><rect x="302.0" y="674.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="696.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>