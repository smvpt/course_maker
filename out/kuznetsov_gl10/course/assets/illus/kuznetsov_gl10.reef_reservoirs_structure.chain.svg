<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 847" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как коллекторы распределяются внутри рифа по площади и разрезу</title><desc id="d">Наблюдение: В небольших одиночных куполовидных рифах наилучшими коллекторскими свойствами обладают центральные части массивов.; Наблюдение: В крупных плосковершинных и атолловидных рифах зона улучшенных коллекторских свойств смещается к периферии рифового комплекса.; Вывод: Площадное распространение зон улучшенных коллекторских свойств зависит от морфолого-генетического типа рифов.; Вывод: Для крупных рифовых массивов характерно слоистое и линзовидно-слоистое расположение наиболее пористых и проницаемых пачек.</desc><rect width="400" height="847" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как коллекторы распределяются</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">внутри рифа по площади и</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">разрезу</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">В небольших одиночных</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">куполовидных рифах наилучшими</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">коллекторскими свойствами</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">обладают центральные части</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">массивов.</text><rect x="16.0" y="283.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">В крупных плосковершинных и</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">атолловидных рифах зона</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">улучшенных коллекторских</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">свойств смещается к периферии</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">рифового комплекса.</text><line x1="200.0" y1="430.0" x2="200.0" y2="442.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,440.0 L200.0,450.0 L207.0,440.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="470.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="481.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="505.0" font-size="18" fill="#ECEFF4" text-anchor="start">Площадное распространение зон</text><text x="28.0" y="530.0" font-size="18" fill="#ECEFF4" text-anchor="start">улучшенных коллекторских</text><text x="28.0" y="555.0" font-size="18" fill="#ECEFF4" text-anchor="start">свойств зависит от</text><text x="28.0" y="580.0" font-size="18" fill="#ECEFF4" text-anchor="start">морфолого-генетического типа</text><text x="28.0" y="605.0" font-size="18" fill="#ECEFF4" text-anchor="start">рифов.</text><rect x="16.0" y="636.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для крупных рифовых массивов</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">характерно слоистое и</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">линзовидно-слоистое</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">расположение наиболее пористых</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">и проницаемых пачек.</text><rect x="302.0" y="799.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="821.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>