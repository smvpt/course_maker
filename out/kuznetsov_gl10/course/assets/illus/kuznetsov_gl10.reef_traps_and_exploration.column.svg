<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 457" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как формируются ловушки для нефти в рифах и как их правильно разведовать</title><desc id="d"></desc><rect width="400" height="457" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как формируются ловушки для</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">нефти в рифах и как их</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">правильно разведовать</text><text x="16.0" y="111.0" font-size="18" fill="#8A96A3" text-anchor="start">Условная колонка: показаны только</text><text x="16.0" y="136.0" font-size="18" fill="#8A96A3" text-anchor="start">породы, которые упоминает шаг.</text><rect x="96.0" y="153.0" width="250.0" height="52.0" rx="0" fill="#6B8E5A"/><text x="221.0" y="185.0" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">глина</text><rect x="96.0" y="205.0" width="250.0" height="52.0" rx="0" fill="#E8C872"/><text x="221.0" y="237.0" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">песчаник</text><rect x="96.0" y="257.0" width="250.0" height="52.0" rx="0" fill="#A98FD1"/><text x="221.0" y="289.0" font-size="18" fill="#0F1419" text-anchor="middle" font-weight="700">доломит</text><line x1="44.0" y1="153.0" x2="44.0" y2="301.0" stroke="#8A96A3" stroke-width="3"/><path d="M37.0,299.0 L44.0,309.0 L51.0,299.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="337.0" font-size="18" fill="#8A96A3" text-anchor="start">глубина ↓</text><text x="16.0" y="363.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">не в масштабе: порядок и</text><text x="16.0" y="388.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">толщины слоёв условные</text><rect x="302.0" y="409.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="431.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>