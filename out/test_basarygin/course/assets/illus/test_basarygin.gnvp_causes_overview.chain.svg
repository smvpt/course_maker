<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 642" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Систематизация причин притока флюидов при проводке скважины</title><desc id="d">Наблюдение: В процессе проводки скважины пластовые флюиды постоянно поступают в скважину, в том числе при превышении забойным давлением пластового.; Наблюдение: Систематизация причин газонефтеводопроявлений представлена на рисунке 4.3.; Вывод: Поступление флюидов из пласта в скважину при превышении забойным давлением пластового практически не может привести к созданию предвыбросовой ситуации.</desc><rect width="400" height="642" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Систематизация причин притока</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">флюидов при проводке скважины</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">В процессе проводки скважины</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">пластовые флюиды постоянно</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">поступают в скважину, в том</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">числе при превышении забойным</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">давлением пластового.</text><rect x="16.0" y="258.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Систематизация причин</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">газонефтеводопроявлений</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">представлена на рисунке 4.3.</text><line x1="200.0" y1="355.0" x2="200.0" y2="367.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,365.0 L200.0,375.0 L207.0,365.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="395.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="406.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="430.0" font-size="18" fill="#ECEFF4" text-anchor="start">Поступление флюидов из пласта в</text><text x="28.0" y="455.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважину при превышении</text><text x="28.0" y="480.0" font-size="18" fill="#ECEFF4" text-anchor="start">забойным давлением пластового</text><text x="28.0" y="505.0" font-size="18" fill="#ECEFF4" text-anchor="start">практически не может привести к</text><text x="28.0" y="530.0" font-size="18" fill="#ECEFF4" text-anchor="start">созданию предвыбросовой</text><text x="28.0" y="555.0" font-size="18" fill="#ECEFF4" text-anchor="start">ситуации.</text><rect x="302.0" y="594.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="616.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>