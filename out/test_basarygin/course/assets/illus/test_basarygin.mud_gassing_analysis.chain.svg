<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1125" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Оценка появления газа в циркулирующем растворе</title><desc id="d">Наблюдение: Относительная приведенная погрешность прибора обозначается через греческую букву дельта и измеряется в процентах.; Наблюдение: Насыщение бурового раствора газом происходит по причинам, как связанным, так и не связанным с недоуравновешенностью пластового давления.; Наблюдение: Глины переходной зоны часто загазованы, и их разбуривание добавляет в раствор газ из породы или приствольной зоны с песчаными линзами.; Допущение: Концентрация газа до 70 процентов считается безопасной в отношении возникновения выбросов.; Вывод: При превышении фонового содержания газа в растворе следует проводить дегазацию и выяснять причины поступления.; Вывод: Присутствие газа из-за остановки циркуляции не требует немедленного утяжеления бурового раствора.</desc><rect width="400" height="1125" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Оценка появления газа в</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">циркулирующем растворе</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Относительная приведенная</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">погрешность прибора</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">обозначается через греческую</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">букву дельта и измеряется в</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">процентах.</text><rect x="16.0" y="258.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Насыщение бурового раствора</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">газом происходит по причинам,</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">как связанным, так и не</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">связанным с</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">недоуравновешенностью</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">пластового давления.</text><rect x="16.0" y="438.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">Глины переходной зоны часто</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">загазованы, и их разбуривание</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">добавляет в раствор газ из</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">породы или приствольной зоны с</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">песчаными линзами.</text><line x1="200.0" y1="585.0" x2="200.0" y2="597.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,595.0 L200.0,605.0 L207.0,595.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="625.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="636.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">Концентрация газа до 70</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">процентов считается безопасной</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">в отношении возникновения</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">выбросов.</text><line x1="200.0" y1="758.0" x2="200.0" y2="770.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,768.0 L200.0,778.0 L207.0,768.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="798.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="809.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">При превышении фонового</text><text x="28.0" y="858.0" font-size="18" fill="#ECEFF4" text-anchor="start">содержания газа в растворе</text><text x="28.0" y="883.0" font-size="18" fill="#ECEFF4" text-anchor="start">следует проводить дегазацию и</text><text x="28.0" y="908.0" font-size="18" fill="#ECEFF4" text-anchor="start">выяснять причины поступления.</text><rect x="16.0" y="939.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">Присутствие газа из-за</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">остановки циркуляции не требует</text><text x="28.0" y="1013.0" font-size="18" fill="#ECEFF4" text-anchor="start">немедленного утяжеления</text><text x="28.0" y="1038.0" font-size="18" fill="#ECEFF4" text-anchor="start">бурового раствора.</text><rect x="302.0" y="1077.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1099.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>