<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 747" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">По каким внешним признакам можно заметить приток флюида</title><desc id="d">Наблюдение: Поступление пластовых флюидов отражается на гидравлических характеристиках циркуляционного потока и свойствах бурового раствора.; Наблюдение: Сигналы и признаки проявлений различаются по информативности, времени поступления и интенсивности притока флюида.; Наблюдение: Установлен признак газонефтводопроявлений в виде увеличения объема или уровня бурового раствора в емкостях циркуляционной системы.; Вывод: Последние три признака могут возникать из-за проявлений или по другим косвенным причинам.</desc><rect width="400" height="747" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">По каким внешним признакам</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">можно заметить приток флюида</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Поступление пластовых флюидов</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">отражается на гидравлических</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">характеристиках циркуляционного</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">потока и свойствах бурового</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">раствора.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Сигналы и признаки проявлений</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">различаются по информативности,</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">времени поступления и</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">интенсивности притока флюида.</text><rect x="16.0" y="388.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Установлен признак</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">газонефтводопроявлений в виде</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">увеличения объема или уровня</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">бурового раствора в емкостях</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">циркуляционной системы.</text><line x1="200.0" y1="535.0" x2="200.0" y2="547.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,545.0 L200.0,555.0 L207.0,545.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="575.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="586.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">Последние три признака могут</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">возникать из-за проявлений или</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">по другим косвенным причинам.</text><rect x="302.0" y="699.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="721.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>