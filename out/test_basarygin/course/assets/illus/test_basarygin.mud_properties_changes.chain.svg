<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1002" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Диагностика притока по изменению параметров бурового раствора</title><desc id="d">Наблюдение: При поступлении пластового флюида в ствол скважины меняются свойства раствора: плотность, водоотдача, вязкость, напряжения сдвига, сопротивление, хлориды.; Наблюдение: Признаки изменения свойств важны при слабых проявлениях с длительным притоком ниже разрешающей способности средств распознавания или при их отсутствии.; Наблюдение: Информация об изменениях свойств раствора поступает на поверхность с запаздыванием на время продвижения забойных пачек к устью.; Вывод: Причиной отклонения свойств растворов от заданных значений могут быть иные факторы, поэтому судят по нескольким показателям одновременно.; Вывод: Информативность перечисленных показателей свойств бурового раствора различна.</desc><rect width="400" height="1002" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Диагностика притока по</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">изменению параметров бурового</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">раствора</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">При поступлении пластового</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">флюида в ствол скважины</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">меняются свойства раствора:</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">плотность, водоотдача,</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">вязкость, напряжения сдвига,</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">сопротивление, хлориды.</text><rect x="16.0" y="308.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Признаки изменения свойств</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">важны при слабых проявлениях с</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">длительным притоком ниже</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">разрешающей способности средств</text><text x="28.0" y="432.0" font-size="18" fill="#ECEFF4" text-anchor="start">распознавания или при их</text><text x="28.0" y="457.0" font-size="18" fill="#ECEFF4" text-anchor="start">отсутствии.</text><rect x="16.0" y="488.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">Информация об изменениях</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">свойств раствора поступает на</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">поверхность с запаздыванием на</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">время продвижения забойных</text><text x="28.0" y="612.0" font-size="18" fill="#ECEFF4" text-anchor="start">пачек к устью.</text><line x1="200.0" y1="635.0" x2="200.0" y2="647.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,645.0 L200.0,655.0 L207.0,645.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="675.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="686.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">Причиной отклонения свойств</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">растворов от заданных значений</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">могут быть иные факторы,</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">поэтому судят по нескольким</text><text x="28.0" y="810.0" font-size="18" fill="#ECEFF4" text-anchor="start">показателям одновременно.</text><rect x="16.0" y="841.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="865.0" font-size="18" fill="#ECEFF4" text-anchor="start">Информативность перечисленных</text><text x="28.0" y="890.0" font-size="18" fill="#ECEFF4" text-anchor="start">показателей свойств бурового</text><text x="28.0" y="915.0" font-size="18" fill="#ECEFF4" text-anchor="start">раствора различна.</text><rect x="302.0" y="954.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="976.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>