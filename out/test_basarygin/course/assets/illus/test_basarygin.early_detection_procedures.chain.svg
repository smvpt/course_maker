<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 549" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Порядок действий буровиков при подготовке к раннему обнаружению</title><desc id="d">Наблюдение: Для своевременного обнаружения притока пластового флюида изолируют рабочую приемную емкость от других.; Наблюдение: Уменьшают поверхность приемной емкости путем установки перегородки.; Наблюдение: Устанавливают исходный уровень бурового раствора после возобновления круговой циркуляции.</desc><rect width="400" height="549" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Порядок действий буровиков при</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">подготовке к раннему</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">обнаружению</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для своевременного обнаружения</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">притока пластового флюида</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">изолируют рабочую приемную</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">емкость от других.</text><rect x="16.0" y="258.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Уменьшают поверхность приемной</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">емкости путем установки</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">перегородки.</text><rect x="16.0" y="363.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="387.0" font-size="18" fill="#ECEFF4" text-anchor="start">Устанавливают исходный уровень</text><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">бурового раствора после</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">возобновления круговой</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">циркуляции.</text><rect x="302.0" y="501.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="523.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>