<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 950" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как меняется давление насосов при поступлении легкого флюида</title><desc id="d">Наблюдение: Плотность поступающих пластовых флюидов ниже плотности бурового раствора, что нарушает баланс давлений в системе.; Наблюдение: Изменение давлений особенно характерно для газопроявлений.; Наблюдение: Уменьшение давления в нагнетательной линии описывается формулой падения давления.; Допущение: Кольцевое пространство и бурильные трубы представляют собой систему сообщающихся сосудов.; Вывод: Перераспределение давлений в системе сообщающихся сосудов происходит за счет снижения давления на буровых насосах.; Вывод: Поступление большой массы газа приводит к существенному снижению давления на насосах.</desc><rect width="400" height="950" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как меняется давление насосов</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">при поступлении легкого флюида</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Плотность поступающих пластовых</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">флюидов ниже плотности бурового</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">раствора, что нарушает баланс</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">давлений в системе.</text><rect x="16.0" y="233.0" width="368.0" height="70.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">Изменение давлений особенно</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">характерно для газопроявлений.</text><rect x="16.0" y="313.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="337.0" font-size="18" fill="#ECEFF4" text-anchor="start">Уменьшение давления в</text><text x="28.0" y="362.0" font-size="18" fill="#ECEFF4" text-anchor="start">нагнетательной линии</text><text x="28.0" y="387.0" font-size="18" fill="#ECEFF4" text-anchor="start">описывается формулой падения</text><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления.</text><line x1="200.0" y1="435.0" x2="200.0" y2="447.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,445.0 L200.0,455.0 L207.0,445.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="475.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="486.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="510.0" font-size="18" fill="#ECEFF4" text-anchor="start">Кольцевое пространство и</text><text x="28.0" y="535.0" font-size="18" fill="#ECEFF4" text-anchor="start">бурильные трубы представляют</text><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">собой систему сообщающихся</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">сосудов.</text><line x1="200.0" y1="608.0" x2="200.0" y2="620.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,618.0 L200.0,628.0 L207.0,618.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="648.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="659.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="683.0" font-size="18" fill="#ECEFF4" text-anchor="start">Перераспределение давлений в</text><text x="28.0" y="708.0" font-size="18" fill="#ECEFF4" text-anchor="start">системе сообщающихся сосудов</text><text x="28.0" y="733.0" font-size="18" fill="#ECEFF4" text-anchor="start">происходит за счет снижения</text><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления на буровых насосах.</text><rect x="16.0" y="789.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="813.0" font-size="18" fill="#ECEFF4" text-anchor="start">Поступление большой массы газа</text><text x="28.0" y="838.0" font-size="18" fill="#ECEFF4" text-anchor="start">приводит к существенному</text><text x="28.0" y="863.0" font-size="18" fill="#ECEFF4" text-anchor="start">снижению давления на насосах.</text><rect x="302.0" y="902.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="924.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>