<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1100" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Изменение расхода выходящего раствора как индикатор притока</title><desc id="d">Наблюдение: Разность объемных скоростей на входе и выходе из скважины измеряется дифференциальными расходомерами.; Наблюдение: Индикатор потока позволяет обнаружить начавшееся проявление при превышении расхода на выходе на 10 % и более.; Наблюдение: Максимальный расход раствора измеряется прибором в литрах в секунду.; Допущение: Условие обнаружения проявления с помощью расходомера описывается формулой минимального приращения расхода.; Вывод: Поступление пластового флюида вызывает увеличение скорости и расхода движущейся впереди жидкости из-за ограничения потока жесткими стенками.; Вывод: Результаты измерения расхода на выходе необходимо сопоставлять с уровнем приемных емкостей, так как рост расхода увеличивает объем в емкостях.</desc><rect width="400" height="1100" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Изменение расхода выходящего</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">раствора как индикатор притока</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Разность объемных скоростей на</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">входе и выходе из скважины</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">измеряется дифференциальными</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">расходомерами.</text><rect x="16.0" y="233.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">Индикатор потока позволяет</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">обнаружить начавшееся</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">проявление при превышении</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">расхода на выходе на 10 % и</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">более.</text><rect x="16.0" y="388.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Максимальный расход раствора</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">измеряется прибором в литрах в</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">секунду.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="536.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">Условие обнаружения проявления</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">с помощью расходомера</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">описывается формулой</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">минимального приращения</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">расхода.</text><line x1="200.0" y1="683.0" x2="200.0" y2="695.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,693.0 L200.0,703.0 L207.0,693.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="723.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="734.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="758.0" font-size="18" fill="#ECEFF4" text-anchor="start">Поступление пластового флюида</text><text x="28.0" y="783.0" font-size="18" fill="#ECEFF4" text-anchor="start">вызывает увеличение скорости и</text><text x="28.0" y="808.0" font-size="18" fill="#ECEFF4" text-anchor="start">расхода движущейся впереди</text><text x="28.0" y="833.0" font-size="18" fill="#ECEFF4" text-anchor="start">жидкости из-за ограничения</text><text x="28.0" y="858.0" font-size="18" fill="#ECEFF4" text-anchor="start">потока жесткими стенками.</text><rect x="16.0" y="889.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="913.0" font-size="18" fill="#ECEFF4" text-anchor="start">Результаты измерения расхода на</text><text x="28.0" y="938.0" font-size="18" fill="#ECEFF4" text-anchor="start">выходе необходимо сопоставлять</text><text x="28.0" y="963.0" font-size="18" fill="#ECEFF4" text-anchor="start">с уровнем приемных емкостей,</text><text x="28.0" y="988.0" font-size="18" fill="#ECEFF4" text-anchor="start">так как рост расхода</text><text x="28.0" y="1013.0" font-size="18" fill="#ECEFF4" text-anchor="start">увеличивает объем в емкостях.</text><rect x="302.0" y="1052.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1074.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>