<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1045" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Контроль объемов жидкости при спуске и подъеме труб</title><desc id="d">Наблюдение: Большинство газонефтеводопроявлений и выбросов связано со спускоподъемными операциями из-за снижения забойного давления и поступления пластовых флюидов.; Наблюдение: При подъеме бурильной колонны забойное давление уменьшается из-за снижения уровня раствора и колебаний гидродинамического давления от движения труб.; Наблюдение: Поступление флюида при спускоподъемных операциях обнаруживается постоянным контролем уровня и объема раствора в сопоставлении с объемом труб.; Допущение: Если обтираторы не используются, следует учитывать объем пленки раствора на наружной поверхности труб.; Вывод: Превышение вытесняемого объема над расчетным и непрекращающийся перелив свидетельствуют о поступлении флюида в ствол скважины.</desc><rect width="400" height="1045" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Контроль объемов жидкости при</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">спуске и подъеме труб</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Большинство</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">газонефтеводопроявлений и</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">выбросов связано со</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">спускоподъемными операциями</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">из-за снижения забойного</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления и поступления…</text><rect x="16.0" y="283.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">При подъеме бурильной колонны</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">забойное давление уменьшается</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">из-за снижения уровня раствора</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">и колебаний гидродинамического</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления от движения труб.</text><rect x="16.0" y="438.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">Поступление флюида при</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">спускоподъемных операциях</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">обнаруживается постоянным</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">контролем уровня и объема</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">раствора в сопоставлении с</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">объемом труб.</text><line x1="200.0" y1="610.0" x2="200.0" y2="622.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,620.0 L200.0,630.0 L207.0,620.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="650.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="661.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">Если обтираторы не</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">используются, следует учитывать</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">объем пленки раствора на</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">наружной поверхности труб.</text><line x1="200.0" y1="783.0" x2="200.0" y2="795.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,793.0 L200.0,803.0 L207.0,793.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="823.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="834.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="858.0" font-size="18" fill="#ECEFF4" text-anchor="start">Превышение вытесняемого объема</text><text x="28.0" y="883.0" font-size="18" fill="#ECEFF4" text-anchor="start">над расчетным и</text><text x="28.0" y="908.0" font-size="18" fill="#ECEFF4" text-anchor="start">непрекращающийся перелив</text><text x="28.0" y="933.0" font-size="18" fill="#ECEFF4" text-anchor="start">свидетельствуют о поступлении</text><text x="28.0" y="958.0" font-size="18" fill="#ECEFF4" text-anchor="start">флюида в ствол скважины.</text><rect x="302.0" y="997.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1019.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>