<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 574" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как обеспечивают безопасность при снижении давления в скважине</title><desc id="d">Наблюдение: При бурении с уменьшением противодействия на пласты должны приниматься определенные меры безопасности.; Наблюдение: Первая мера безопасности — прогнозирование пластового давления на всех стадиях проектирования и строительства.; Наблюдение: Вторая мера безопасности — разработка надежных методов проектирования конструкций скважин.</desc><rect width="400" height="574" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как обеспечивают безопасность</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">при снижении давления в</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">скважине</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">При бурении с уменьшением</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">противодействия на пласты</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">должны приниматься определенные</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">меры безопасности.</text><rect x="16.0" y="258.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Первая мера безопасности —</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">прогнозирование пластового</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">давления на всех стадиях</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">проектирования и строительства.</text><rect x="16.0" y="388.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Вторая мера безопасности —</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">разработка надежных методов</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">проектирования конструкций</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважин.</text><rect x="302.0" y="526.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="548.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>