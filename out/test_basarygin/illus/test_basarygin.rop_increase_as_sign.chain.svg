<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1250" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как резкий рост скорости бурения предупреждает об опасности</title><desc id="d">Наблюдение: Устойчивое самопроизвольное увеличение механической скорости указывает на углубление скважины в зону АВПД с постоянным нарастанием порового давления в глинах.; Наблюдение: В зарубежной практике быстрое повышение механической скорости бурения более чем в 2 раза считается признаком вскрытия пласта высокого давления и возможности проявления.; Наблюдение: Резкое увеличение скорости бурения может быть следствием провалов инструмента при вскрытии крупных трещин или карстовых каверн в известняках.; Допущение: Скачок проходки возникает при небольшой мощности переходной зоны, близости высоконапорных коллекторов или внедрении долота в высоконапорную залежь.; Вывод: Резкое увеличение механической скорости или скачок проходки в переходной зоне свидетельствует о быстром возрастании аномальности давления на забое.; Вывод: Во всех случаях скачка проходки аномальность давления коллектора превышает запас противодавления бурового раствора на забое.</desc><rect width="400" height="1250" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как резкий рост скорости</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">бурения предупреждает об</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">опасности</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Устойчивое самопроизвольное</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">увеличение механической</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">скорости указывает на</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">углубление скважины в зону АВПД</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">с постоянным нарастанием</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">порового давления в глинах.</text><rect x="16.0" y="308.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">В зарубежной практике быстрое</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">повышение механической скорости</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">бурения более чем в 2 раза</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">считается признаком вскрытия</text><text x="28.0" y="432.0" font-size="18" fill="#ECEFF4" text-anchor="start">пласта высокого давления и</text><text x="28.0" y="457.0" font-size="18" fill="#ECEFF4" text-anchor="start">возможности проявления.</text><rect x="16.0" y="488.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">Резкое увеличение скорости</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">бурения может быть следствием</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">провалов инструмента при</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">вскрытии крупных трещин или</text><text x="28.0" y="612.0" font-size="18" fill="#ECEFF4" text-anchor="start">карстовых каверн в известняках.</text><line x1="200.0" y1="635.0" x2="200.0" y2="647.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,645.0 L200.0,655.0 L207.0,645.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="675.0" font-size="18" fill="#95A5A6" text-anchor="start" font-weight="700">Допущение</text><rect x="16.0" y="686.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#95A5A6" stroke-width="2" stroke-dasharray="7 5"/><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">Скачок проходки возникает при</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">небольшой мощности переходной</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">зоны, близости высоконапорных</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">коллекторов или внедрении</text><text x="28.0" y="810.0" font-size="18" fill="#ECEFF4" text-anchor="start">долота в высоконапорную залежь.</text><line x1="200.0" y1="833.0" x2="200.0" y2="845.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,843.0 L200.0,853.0 L207.0,843.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="873.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="884.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="908.0" font-size="18" fill="#ECEFF4" text-anchor="start">Резкое увеличение механической</text><text x="28.0" y="933.0" font-size="18" fill="#ECEFF4" text-anchor="start">скорости или скачок проходки в</text><text x="28.0" y="958.0" font-size="18" fill="#ECEFF4" text-anchor="start">переходной зоне свидетельствует</text><text x="28.0" y="983.0" font-size="18" fill="#ECEFF4" text-anchor="start">о быстром возрастании</text><text x="28.0" y="1008.0" font-size="18" fill="#ECEFF4" text-anchor="start">аномальности давления на забое.</text><rect x="16.0" y="1039.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="1063.0" font-size="18" fill="#ECEFF4" text-anchor="start">Во всех случаях скачка проходки</text><text x="28.0" y="1088.0" font-size="18" fill="#ECEFF4" text-anchor="start">аномальность давления</text><text x="28.0" y="1113.0" font-size="18" fill="#ECEFF4" text-anchor="start">коллектора превышает запас</text><text x="28.0" y="1138.0" font-size="18" fill="#ECEFF4" text-anchor="start">противодавления бурового</text><text x="28.0" y="1163.0" font-size="18" fill="#ECEFF4" text-anchor="start">раствора на забое.</text><rect x="302.0" y="1202.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="1224.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>