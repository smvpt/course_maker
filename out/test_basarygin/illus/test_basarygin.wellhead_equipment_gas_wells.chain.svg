<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 692" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Особенности конструкции устья для предотвращения межколонных проявлений</title><desc id="d">Наблюдение: В ряде нефтепромысловых районов при обосновании конструкций газовых скважин наблюдается стремление укрепить их устьевую часть.; Наблюдение: Устьевая часть конструкции усиливается за счет дополнительной обсадной колонны перед спуском эксплуатационной.; Вывод: Недостаточная герметичность резьбовых соединений стандартных обсадных труб вызывает межколонные проявления и грифонообразование при эксплуатации газовых скважин.</desc><rect width="400" height="692" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Особенности конструкции устья</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">для предотвращения межколонных</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">проявлений</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">В ряде нефтепромысловых районов</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">при обосновании конструкций</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">газовых скважин наблюдается</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">стремление укрепить их устьевую</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">часть.</text><rect x="16.0" y="283.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Устьевая часть конструкции</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">усиливается за счет</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">дополнительной обсадной колонны</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">перед спуском эксплуатационной.</text><line x1="200.0" y1="405.0" x2="200.0" y2="417.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,415.0 L200.0,425.0 L207.0,415.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="445.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="456.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="480.0" font-size="18" fill="#ECEFF4" text-anchor="start">Недостаточная герметичность</text><text x="28.0" y="505.0" font-size="18" fill="#ECEFF4" text-anchor="start">резьбовых соединений</text><text x="28.0" y="530.0" font-size="18" fill="#ECEFF4" text-anchor="start">стандартных обсадных труб</text><text x="28.0" y="555.0" font-size="18" fill="#ECEFF4" text-anchor="start">вызывает межколонные проявления</text><text x="28.0" y="580.0" font-size="18" fill="#ECEFF4" text-anchor="start">и грифонообразование при</text><text x="28.0" y="605.0" font-size="18" fill="#ECEFF4" text-anchor="start">эксплуатации газовых скважин.</text><rect x="302.0" y="644.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="666.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>