<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 897" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Устройство устьевой арматуры и превенторов для контроля скважины</title><desc id="d">Наблюдение: В сложных геологических условиях при опасности нефтегазопроявлений на устье монтируют сложную компоновку оборудования из нескольких превенторов.; Наблюдение: Схема устьевого оборудования применяется при вскрытии и испытании пластов в глубоких скважинах на суше и на море.; Наблюдение: В компоновку входит манифольд нагнетательный, штуцерный манифольд, кольцевой превентор, трубные превенторы, превентор с глухими плашками и линии глушения и штуцерные.; Вывод: Компоновка устьевого оборудования позволяет контролировать скважину при высоких пластовых давлениях и ликвидировать проявления или выбросы.</desc><rect width="400" height="897" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Устройство устьевой арматуры и</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">превенторов для контроля</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">скважины</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">В сложных геологических</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">условиях при опасности</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">нефтегазопроявлений на устье</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">монтируют сложную компоновку</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">оборудования из нескольких</text><text x="28.0" y="277.0" font-size="18" fill="#ECEFF4" text-anchor="start">превенторов.</text><rect x="16.0" y="308.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">Схема устьевого оборудования</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">применяется при вскрытии и</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">испытании пластов в глубоких</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважинах на суше и на море.</text><rect x="16.0" y="438.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">В компоновку входит манифольд</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">нагнетательный, штуцерный</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">манифольд, кольцевой превентор,</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">трубные превенторы, превентор с</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">глухими плашками и линии</text><text x="28.0" y="587.0" font-size="18" fill="#ECEFF4" text-anchor="start">глушения и штуцерные.</text><line x1="200.0" y1="610.0" x2="200.0" y2="622.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,620.0 L200.0,630.0 L207.0,620.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="650.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="661.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">Компоновка устьевого</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">оборудования позволяет</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">контролировать скважину при</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">высоких пластовых давлениях и</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">ликвидировать проявления или</text><text x="28.0" y="810.0" font-size="18" fill="#ECEFF4" text-anchor="start">выбросы.</text><rect x="302.0" y="849.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="871.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>