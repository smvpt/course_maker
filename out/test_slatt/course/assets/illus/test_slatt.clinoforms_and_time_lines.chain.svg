<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1002" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как геологические поверхности пересекают слои пород</title><desc id="d">Наблюдение: Для корректной корреляции разрезов важно понимать, что клиноформы, представляющие геологические временные линии, пересекают литостратиграфические границы.; Наблюдение: Гипотетический пример на рис. 9.10 показывает корреляции на основе литофаций и геологического времени.; Наблюдение: Глинистые и гетеролитные интервалы разделяют песчаные интервалы, поэтому пески между скважинами 1 и 2 не сообщаются между собой.; Вывод: Отсутствие гидродинамической связи между песками ухудшает эффективность заводнения и продуктивность одиночных скважин.; Вывод: Истинные хроностратиграфические корреляции демонстрируют потенциал латеральных дисконтинуитетов внутри литостратиграфических интервалов.</desc><rect width="400" height="1002" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как геологические поверхности</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">пересекают слои пород</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Для корректной корреляции</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">разрезов важно понимать, что</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">клиноформы, представляющие</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">геологические временные линии,</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">пересекают</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">литостратиграфические границы.</text><rect x="16.0" y="283.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Гипотетический пример на рис.</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">9.10 показывает корреляции на</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">основе литофаций и</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">геологического времени.</text><rect x="16.0" y="413.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">Глинистые и гетеролитные</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">интервалы разделяют песчаные</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">интервалы, поэтому пески между</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважинами 1 и 2 не сообщаются</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">между собой.</text><line x1="200.0" y1="560.0" x2="200.0" y2="572.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,570.0 L200.0,580.0 L207.0,570.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="600.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="611.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">Отсутствие гидродинамической</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">связи между песками ухудшает</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">эффективность заводнения и</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">продуктивность одиночных</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">скважин.</text><rect x="16.0" y="766.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="790.0" font-size="18" fill="#ECEFF4" text-anchor="start">Истинные хроностратиграфические</text><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">корреляции демонстрируют</text><text x="28.0" y="840.0" font-size="18" fill="#ECEFF4" text-anchor="start">потенциал латеральных</text><text x="28.0" y="865.0" font-size="18" fill="#ECEFF4" text-anchor="start">дисконтинуитетов внутри</text><text x="28.0" y="890.0" font-size="18" fill="#ECEFF4" text-anchor="start">литостратиграфических</text><text x="28.0" y="915.0" font-size="18" fill="#ECEFF4" text-anchor="start">интервалов.</text><rect x="302.0" y="954.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="976.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>