<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 872" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Сравнение двух методов связи скважин на примере современной дельты</title><desc id="d">Наблюдение: На карте дельты Меконга показаны верхняя и нижняя дельтовые равнины, береговые валы, а также линии разрезов A-B с расположением скважин.; Наблюдение: Литостратиграфическая корреляция скважин строится на основе интерпретации палеоэкологических условий.; Наблюдение: Пронумерованные линии, пересекающие границы литофаций, являются измеренными линиями геологического времени в тысячах лет и демонстрируют проградационную природу дельты.; Вывод: Секвентно-стратиграфическая (хроностратиграфическая) корреляция скважин основывается на линиях времени и отличается от литостратиграфической стратегии.</desc><rect width="400" height="872" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Сравнение двух методов связи</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">скважин на примере современной</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">дельты</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">На карте дельты Меконга</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">показаны верхняя и нижняя</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">дельтовые равнины, береговые</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">валы, а также линии разрезов</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">A-B с расположением скважин.</text><rect x="16.0" y="283.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Литостратиграфическая</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">корреляция скважин строится на</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">основе интерпретации</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">палеоэкологических условий.</text><rect x="16.0" y="413.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">Пронумерованные линии,</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">пересекающие границы литофаций,</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">являются измеренными линиями</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">геологического времени в</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">тысячах лет и демонстрируют</text><text x="28.0" y="562.0" font-size="18" fill="#ECEFF4" text-anchor="start">проградационную природу дельты.</text><line x1="200.0" y1="585.0" x2="200.0" y2="597.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,595.0 L200.0,605.0 L207.0,595.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="625.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="636.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">Секвентно-стратиграфическая</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">(хроностратиграфическая)</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">корреляция скважин основывается</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">на линиях времени и отличается</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">от литостратиграфической</text><text x="28.0" y="785.0" font-size="18" fill="#ECEFF4" text-anchor="start">стратегии.</text><rect x="302.0" y="824.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="846.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>