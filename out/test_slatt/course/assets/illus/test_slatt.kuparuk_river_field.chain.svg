<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 852" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Многослойное строение и проградация пластов на месторождении Купарук</title><desc id="d">Наблюдение: Месторождение Купарук-Ривер на Северном склоне Аляски является вторым по величине нефтяным месторождением в Северной Америке.; Наблюдение: По состоянию на 2006 год на месторождении было добыто 2 миллиарда баррелей нефти.; Наблюдение: Добыча нефти ведется из двух интервалов, обозначенных как единицы A и C.; Вывод: На ранних этапах разработки каждая единица считалась латерально выдержанным песчаным телом.; Вывод: Секвенс-стратиграфическая корреляция показала, что единица A состоит из шести отдельных песчаных тел.</desc><rect width="400" height="852" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Многослойное строение и</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">проградация пластов на</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">месторождении Купарук</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Месторождение Купарук-Ривер на</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">Северном склоне Аляски является</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">вторым по величине нефтяным</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">месторождением в Северной</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">Америке.</text><rect x="16.0" y="283.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">По состоянию на 2006 год на</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">месторождении было добыто 2</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">миллиарда баррелей нефти.</text><rect x="16.0" y="388.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">Добыча нефти ведется из двух</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">интервалов, обозначенных как</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">единицы A и C.</text><line x1="200.0" y1="485.0" x2="200.0" y2="497.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,495.0 L200.0,505.0 L207.0,495.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="525.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="536.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="560.0" font-size="18" fill="#ECEFF4" text-anchor="start">На ранних этапах разработки</text><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">каждая единица считалась</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">латерально выдержанным песчаным</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">телом.</text><rect x="16.0" y="666.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="690.0" font-size="18" fill="#ECEFF4" text-anchor="start">Секвенс-стратиграфическая</text><text x="28.0" y="715.0" font-size="18" fill="#ECEFF4" text-anchor="start">корреляция показала, что</text><text x="28.0" y="740.0" font-size="18" fill="#ECEFF4" text-anchor="start">единица A состоит из шести</text><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">отдельных песчаных тел.</text><rect x="302.0" y="804.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="826.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>