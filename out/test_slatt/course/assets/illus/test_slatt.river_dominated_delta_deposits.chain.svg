<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 952" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Главные элементы и фации дельт, формируемых реками</title><desc id="d">Наблюдение: Главными фациями речно-доминированной дельты являются русла и устьевые бары, разделенные межрусловыми бухтами и болотами.; Наблюдение: Фации определяются по вертикальной последовательности зернистости с укрупнением вверх и характерному латеральному утончению на каротаже.; Наблюдение: В устьевом баре Прудо-Бей выделено семь литофаций, из которых наиболее отсортированная имеет среднюю проницаемость 129 мД.; Вывод: Наиболее проницаемые пески отлагались осадочными шлейфами в период паводков в апексе устьевых баров.; Вывод: Многократное разветвление каналов при проградации формирует широкий пластовый песчаный шлейф с внутренними прерывистостями фаций.</desc><rect width="400" height="952" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Главные элементы и фации дельт,</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">формируемых реками</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Главными фациями</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">речно-доминированной дельты</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">являются русла и устьевые бары,</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">разделенные межрусловыми</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">бухтами и болотами.</text><rect x="16.0" y="258.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Фации определяются по</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">вертикальной последовательности</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">зернистости с укрупнением вверх</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">и характерному латеральному</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">утончению на каротаже.</text><rect x="16.0" y="413.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">В устьевом баре Прудо-Бей</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">выделено семь литофаций, из</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">которых наиболее</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">отсортированная имеет среднюю</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">проницаемость 129 мД.</text><line x1="200.0" y1="560.0" x2="200.0" y2="572.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,570.0 L200.0,580.0 L207.0,570.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="600.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="611.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">Наиболее проницаемые пески</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">отлагались осадочными шлейфами</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">в период паводков в апексе</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">устьевых баров.</text><rect x="16.0" y="741.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">Многократное разветвление</text><text x="28.0" y="790.0" font-size="18" fill="#ECEFF4" text-anchor="start">каналов при проградации</text><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">формирует широкий пластовый</text><text x="28.0" y="840.0" font-size="18" fill="#ECEFF4" text-anchor="start">песчаный шлейф с внутренними</text><text x="28.0" y="865.0" font-size="18" fill="#ECEFF4" text-anchor="start">прерывистостями фаций.</text><rect x="302.0" y="904.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="926.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>