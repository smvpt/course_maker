<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 927" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как волны и течения формируют песчаные пляжи и дельты</title><desc id="d">Наблюдение: Поступающий к берегу осадок в незащищенных от волн и течений условиях рассеивается латерально.; Наблюдение: Линейная береговая линия, питаемая вдольбереговым потоком, проградирует, аккрецирует латерально, а ее речное устье постепенно отклоняется.; Наблюдение: Конечным результатом является обширное и мощное веерообразное или дугообразное тело песка вроде дельты Нила.; Вывод: При достаточном поступлении песка береговая зона со временем аккрецирует латерально и проградирует в сторону бассейна.; Вывод: Пористость и проницаемость увеличиваются снизу вверх вследствие эффекта размера зерен.</desc><rect width="400" height="927" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как волны и течения формируют</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">песчаные пляжи и дельты</text><text x="16.0" y="92.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="103.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="127.0" font-size="18" fill="#ECEFF4" text-anchor="start">Поступающий к берегу осадок в</text><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">незащищенных от волн и течений</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">условиях рассеивается</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">латерально.</text><rect x="16.0" y="233.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="257.0" font-size="18" fill="#ECEFF4" text-anchor="start">Линейная береговая линия,</text><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">питаемая вдольбереговым</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">потоком, проградирует,</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">аккрецирует латерально, а ее</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">речное устье постепенно</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">отклоняется.</text><rect x="16.0" y="413.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">Конечным результатом является</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">обширное и мощное веерообразное</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">или дугообразное тело песка</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">вроде дельты Нила.</text><line x1="200.0" y1="535.0" x2="200.0" y2="547.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,545.0 L200.0,555.0 L207.0,545.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="575.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="586.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">При достаточном поступлении</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">песка береговая зона со</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">временем аккрецирует латерально</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">и проградирует в сторону</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">бассейна.</text><rect x="16.0" y="741.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">Пористость и проницаемость</text><text x="28.0" y="790.0" font-size="18" fill="#ECEFF4" text-anchor="start">увеличиваются снизу вверх</text><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">вследствие эффекта размера</text><text x="28.0" y="840.0" font-size="18" fill="#ECEFF4" text-anchor="start">зерен.</text><rect x="302.0" y="879.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="901.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>