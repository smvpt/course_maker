<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 927" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Особенности разработки дельтовых отложений на гигантском месторождении</title><desc id="d">Наблюдение: Зона Ромео состоит в основном из отложений дельтового фронта и продельты речно-доминированного типа.; Наблюдение: Продуктивными дельтовыми фациями являются песчаники русел и устьевых баров.; Наблюдение: Применение хроностратиграфической схемы корреляции позволило лучше согласовать корреляцию скважин с историей добычи.; Вывод: История осадконакопления показывает юго-восточную проградацию малоуклонных тонкозернистых речных систем на расстояние около 60 миль.; Вывод: Речная седиментация вызвала значительные латеральные и вертикальные изменения фаций, создавшие высокую гетерогенность резервуара.</desc><rect width="400" height="927" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Особенности разработки</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">дельтовых отложений на</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">гигантском месторождении</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Зона Ромео состоит в основном</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">из отложений дельтового фронта</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">и продельты</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">речно-доминированного типа.</text><rect x="16.0" y="258.0" width="368.0" height="95.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="282.0" font-size="18" fill="#ECEFF4" text-anchor="start">Продуктивными дельтовыми</text><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">фациями являются песчаники</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">русел и устьевых баров.</text><rect x="16.0" y="363.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="387.0" font-size="18" fill="#ECEFF4" text-anchor="start">Применение</text><text x="28.0" y="412.0" font-size="18" fill="#ECEFF4" text-anchor="start">хроностратиграфической схемы</text><text x="28.0" y="437.0" font-size="18" fill="#ECEFF4" text-anchor="start">корреляции позволило лучше</text><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">согласовать корреляцию скважин</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">с историей добычи.</text><line x1="200.0" y1="510.0" x2="200.0" y2="522.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,520.0 L200.0,530.0 L207.0,520.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="550.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="561.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="585.0" font-size="18" fill="#ECEFF4" text-anchor="start">История осадконакопления</text><text x="28.0" y="610.0" font-size="18" fill="#ECEFF4" text-anchor="start">показывает юго-восточную</text><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">проградацию малоуклонных</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">тонкозернистых речных систем на</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">расстояние около 60 миль.</text><rect x="16.0" y="716.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="740.0" font-size="18" fill="#ECEFF4" text-anchor="start">Речная седиментация вызвала</text><text x="28.0" y="765.0" font-size="18" fill="#ECEFF4" text-anchor="start">значительные латеральные и</text><text x="28.0" y="790.0" font-size="18" fill="#ECEFF4" text-anchor="start">вертикальные изменения фаций,</text><text x="28.0" y="815.0" font-size="18" fill="#ECEFF4" text-anchor="start">создавшие высокую</text><text x="28.0" y="840.0" font-size="18" fill="#ECEFF4" text-anchor="start">гетерогенность резервуара.</text><rect x="302.0" y="879.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="901.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>