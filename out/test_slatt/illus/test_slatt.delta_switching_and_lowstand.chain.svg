<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 847" role="img" aria-labelledby="t d" font-family="system-ui, 'Segoe UI', sans-serif"><title id="t">Как реки меняют направление и образуют дельты при падении уровня моря</title><desc id="d">Наблюдение: Дельты могут формироваться во время относительного падения уровня моря, образуя низкопотенциальные или бровковые дельты.; Наблюдение: Относительное падение уровня моря вызывает врезание долин, а также отступание береговой линии в сторону моря и ее понижение.; Наблюдение: Низкопотенциальные дельты обычно менее крупные и менее распространенные, чем высокопотенциальные дельты.; Вывод: Дельты подвержены процессам переключения русел распределительных рукавов, которые могут играть даже более важную роль в их эволюции, чем изменение уровня моря.</desc><rect width="400" height="847" rx="12" fill="#0F1419"/><text x="16.0" y="30.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Как реки меняют направление и</text><text x="16.0" y="55.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">образуют дельты при падении</text><text x="16.0" y="80.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">уровня моря</text><text x="16.0" y="117.0" font-size="18" fill="#F1C40F" text-anchor="start" font-weight="700">Наблюдение</text><rect x="16.0" y="128.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="152.0" font-size="18" fill="#ECEFF4" text-anchor="start">Дельты могут формироваться во</text><text x="28.0" y="177.0" font-size="18" fill="#ECEFF4" text-anchor="start">время относительного падения</text><text x="28.0" y="202.0" font-size="18" fill="#ECEFF4" text-anchor="start">уровня моря, образуя</text><text x="28.0" y="227.0" font-size="18" fill="#ECEFF4" text-anchor="start">низкопотенциальные или</text><text x="28.0" y="252.0" font-size="18" fill="#ECEFF4" text-anchor="start">бровковые дельты.</text><rect x="16.0" y="283.0" width="368.0" height="145.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="307.0" font-size="18" fill="#ECEFF4" text-anchor="start">Относительное падение уровня</text><text x="28.0" y="332.0" font-size="18" fill="#ECEFF4" text-anchor="start">моря вызывает врезание долин, а</text><text x="28.0" y="357.0" font-size="18" fill="#ECEFF4" text-anchor="start">также отступание береговой</text><text x="28.0" y="382.0" font-size="18" fill="#ECEFF4" text-anchor="start">линии в сторону моря и ее</text><text x="28.0" y="407.0" font-size="18" fill="#ECEFF4" text-anchor="start">понижение.</text><rect x="16.0" y="438.0" width="368.0" height="120.0" rx="10" fill="#1A2129" stroke="#F1C40F" stroke-width="2"/><text x="28.0" y="462.0" font-size="18" fill="#ECEFF4" text-anchor="start">Низкопотенциальные дельты</text><text x="28.0" y="487.0" font-size="18" fill="#ECEFF4" text-anchor="start">обычно менее крупные и менее</text><text x="28.0" y="512.0" font-size="18" fill="#ECEFF4" text-anchor="start">распространенные, чем</text><text x="28.0" y="537.0" font-size="18" fill="#ECEFF4" text-anchor="start">высокопотенциальные дельты.</text><line x1="200.0" y1="560.0" x2="200.0" y2="572.0" stroke="#8A96A3" stroke-width="3"/><path d="M193.0,570.0 L200.0,580.0 L207.0,570.0" fill="none" stroke="#8A96A3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="16.0" y="600.0" font-size="18" fill="#ECEFF4" text-anchor="start" font-weight="700">Вывод</text><rect x="16.0" y="611.0" width="368.0" height="170.0" rx="10" fill="#1A2129" stroke="#8A96A3" stroke-width="2"/><text x="28.0" y="635.0" font-size="18" fill="#ECEFF4" text-anchor="start">Дельты подвержены процессам</text><text x="28.0" y="660.0" font-size="18" fill="#ECEFF4" text-anchor="start">переключения русел</text><text x="28.0" y="685.0" font-size="18" fill="#ECEFF4" text-anchor="start">распределительных рукавов,</text><text x="28.0" y="710.0" font-size="18" fill="#ECEFF4" text-anchor="start">которые могут играть даже более</text><text x="28.0" y="735.0" font-size="18" fill="#ECEFF4" text-anchor="start">важную роль в их эволюции, чем</text><text x="28.0" y="760.0" font-size="18" fill="#ECEFF4" text-anchor="start">изменение уровня моря.</text><rect x="302.0" y="799.0" width="82.0" height="32.0" rx="16" fill="#8E44AD"/><text x="343.0" y="821.0" font-size="18" fill="#ECEFF4" text-anchor="middle" font-weight="700">схема</text></svg>